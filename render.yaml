# Render Blueprint (docs/DEPLOY.md): one web service serving the API and the React app on one origin (T-03).
# Data and sign-in live in a Supabase project you create first; its values are entered when the Blueprint is applied.
services:
  - type: web
    name: impact-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: 0.5c-512mb          # "free" sleeps after 15 min idle (about a minute to wake)
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL       # Supabase: Connect > Shared pooler > Session mode (port 5432)
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: VITE_SUPABASE_URL  # same as SUPABASE_URL; used at build time for the browser sign-in
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_GOOGLE_AUTH   # "on" once a Google OAuth client is set up in Supabase
        value: "off"
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ADMIN_PASSWORD     # 8+ characters, not change-me
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_MODE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: PROXY_HOPS
        value: "1"
