# Render Blueprint (docs/DEPLOY.md, docs/CI_CD.md): one web service, production, serving the API and the React app on
# one origin (T-03), paired with the impact-production Supabase project. Staging is not set up yet; to add it, copy
# this service as `impact-app-staging` (docs/DEPLOY.md, "Adding staging later").
# Render's own auto-deploy is off: GitHub Actions deploys a commit only after every check passes and migrations are
# applied (.github/workflows/deploy.yml calls each service's deploy hook with that exact commit).

services:
  - type: web
    name: impact-app            # production
    runtime: docker
    branch: main
    autoDeployTrigger: "off"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free                  # Hobby workspace: $0; free instances sleep after 15 min idle (docs/DEPLOY.md)
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL       # Supabase: Connect > Shared pooler > Session mode (port 5432)
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: VITE_SUPABASE_URL  # same as SUPABASE_URL; used at build time for the browser sign-in
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_GOOGLE_AUTH   # "on" once a Google OAuth client is set up in Supabase
        value: "off"
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ADMIN_PASSWORD     # 8+ characters, not change-me
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_MODE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: PROXY_HOPS
        value: "1"
