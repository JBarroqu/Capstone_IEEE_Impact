# Security checks (docs/CI_CD.md): code scanning, committed secrets, vulnerable dependencies, and the production image.
# Runs on every PR and push, and weekly so a newly published vulnerability is caught even when nothing changed.
name: Security

on:
  pull_request:
  push:
    branches: [main, integration]
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # upload results to the Security tab
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  secrets:
    name: Committed secrets (gitleaks, full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --no-banner --redact --verbose

  dependencies:
    name: Vulnerable dependencies (npm, pip)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      # What ships to users is held to "moderate"; build and test tools to "high" (docs/CI_CD.md, "Audit levels").
      - name: npm, shipped packages (moderate and above)
        run: |
          npm audit --omit=dev --audit-level=moderate
          npm --prefix frontend audit --omit=dev --audit-level=moderate
      - name: npm, all packages including dev tools (high and above)
        run: |
          npm audit --audit-level=high
          npm --prefix frontend audit --audit-level=high
      - name: pip (runtime and dev requirements)
        run: |
          python -m pip install --quiet pip-audit==2.10.1
          pip-audit --strict -r backend/requirements.txt
          pip-audit --strict -r backend/requirements-dev.txt

  image:
    name: Production image (Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: impact-app:scan
          build-args: |
            VITE_SUPABASE_URL=http://127.0.0.1:54321
            VITE_SUPABASE_PUBLISHABLE_KEY=ci-placeholder
          cache-from: type=gha,scope=impact-app
      # Fails only on HIGH/CRITICAL issues that already have a fix, so it's always something we can act on.
      - name: Scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/.trivyignore:/.trivyignore:ro" \
            aquasec/trivy:0.76.1 image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile /.trivyignore --exit-code 1 --no-progress impact-app:scan

  required:
    name: Security passed
    if: always()
    needs: [codeql, secrets, dependencies, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every check passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || { echo "::error::a security check did not pass ($r)"; exit 1; }; done
