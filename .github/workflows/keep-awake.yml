# Keeps the production app awake during the day (docs/DEPLOY.md, "Costs and sleep"). Render free services sleep after
# 15 minutes idle; a request every 10 minutes prevents that. Production only, 7am-midnight Arizona time (UTC-7, no
# daylight saving): about 530 hours a month, inside the workspace's 750 free hours. Around the clock would be ~744
# hours, too close to the limit: when it runs out, Render suspends the workspace's free services until the month ends.
# GitHub may run scheduled jobs late, and turns them off after 60 days without a commit to the repository.
name: Keep awake

on:
  schedule:
    - cron: "*/10 0-6,14-23 * * *"   # every 10 min, 14:00-06:59 UTC = 7:00am-11:59pm Arizona
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Ping production
        env:
          URL: ${{ vars.KEEP_AWAKE_URL }}   # repository variable: the production address, e.g. https://<your-app>.onrender.com
        # Never fails the run: before the first deploy there is nothing to ping, and a failure every 10 minutes
        # would only send email.
        run: |
          if [ -z "$URL" ]; then echo "::notice::KEEP_AWAKE_URL is not set; nothing to ping (docs/DEPLOY.md)"; exit 0; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "$URL/api/v1/health" || true)
          if [ "$code" = "200" ]; then echo "awake ($URL)"; else echo "::warning::$URL/api/v1/health answered '$code'"; fi
