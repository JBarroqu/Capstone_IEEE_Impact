# Nightly live check of the real model chain (npm run llm:check): classify, follow-up questions and move generation
# through Gemini. Models get retired or overloaded often; when the check fails, an issue labelled `llm-check` is opened
# (or commented on), and it is closed automatically by the next passing run. Never runs on PRs and never blocks merges.
name: Live model check

on:
  schedule:
    - cron: "23 13 * * *"   # daily 13:23 UTC (morning in Arizona)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: llm-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: python -m pip install --quiet -r backend/requirements.txt
      - name: Run the model chain
        id: run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then echo "::error::GEMINI_API_KEY secret is not set (docs/CI_CD.md)"; exit 1; fi
          set -o pipefail
          python backend/scripts/llm_check.py --all 2>&1 | tee llm-check.log
      - name: Open or update the issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create llm-check --color B60205 --description "Nightly live model check failed" 2>/dev/null || true
          {
            echo "The nightly model check failed: $RUN_URL"
            echo
            echo "Last lines:"
            echo '~~~'
            tail -40 llm-check.log 2>/dev/null || true
            echo '~~~'
            cat <<'EOF'
          Run `npm run llm:check -- --all` locally to see which models answer; pin working ones with `GEMINI_MODELS` if needed.
          EOF
          } > issue.md
          open=$(gh issue list --label llm-check --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then gh issue comment "$open" --body-file issue.md; else gh issue create --title "Live model check is failing" --label llm-check --body-file issue.md; fi
      - name: Close the issue once it passes again
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label llm-check --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Passing again: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          done
