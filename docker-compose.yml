# docker compose up --build  ->  app on http://localhost:3010 (or PORT), admin at /admin, API on :8000 (or API_PORT).
# Reads API keys, ADMIN_PASSWORD, FLOW_MOVES etc. from .env; DATABASE_URL and OLLAMA_URL are set here for the containers.
# The browser calls the API on the same host at API_PORT, so a LAN link (http://192.168.x.x:3010) needs no setup.
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: wish
      POSTGRES_PASSWORD: wish
      POSTGRES_DB: wish_engine
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wish -d wish_engine"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Creates missing tables and columns (backend/scripts/migrate.py), then exits.
  migrate:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: ["python", "scripts/migrate.py"]
    environment:
      DATABASE_URL: postgres://wish:wish@db:5432/wish_engine
    depends_on:
      db: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgres://wish:wish@db:5432/wish_engine
      # Ollama running on the host Mac (optional backup model).
      OLLAMA_URL: http://host.docker.internal:11434
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  app:
    build:
      context: .
      target: runner
      # Baked into the browser bundle: which port the browser calls the API on.
      args: { NEXT_PUBLIC_API_PORT: "${API_PORT:-8000}" }
    environment:
      # Server-side calls (admin page, config) go straight to the api container.
      API_URL: http://api:8000
    ports:
      - "${PORT:-3010}:3000"
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
