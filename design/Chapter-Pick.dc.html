    <span style="font-size:17px;font-weight:800;color:#00629B">Wish Engine</span>
    <a href="Chapter-Intake.dc.html" style="font-size:14px;font-weight:600;text-decoration:underline;padding:10px 0">Start over</a>
  </div>

  <div style="display:flex;flex-direction:column;gap:6px">
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px">
      <span style="height:6px;border-radius:3px;background:#00629B"></span>
      <span style="height:6px;border-radius:3px;background:#D5DEE6"></span>
      <span style="height:6px;border-radius:3px;background:#D5DEE6"></span>
    </div>
    <span style="font-size:13px;font-weight:600;color:#4A5B6B">Move 1 of 3</span>
  </div>

  <div style="background:#E5F3F9;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px">

    <span style="font-size:15px;font-weight:700">Connect with people in the healthcare industry</span>
  </div>

  <div style="display:flex;flex-direction:column;gap:4px">
    <h1 style="margin:0;font-size:27px;font-weight:800;line-height:1.1">Pick your first move</h1>
    <p style="margin:0;font-size:15px;color:#4A5B6B">Small and quick. Which one would you actually do this week?</p>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px">

      <span style="display:flex;flex-direction:column;gap:8px;flex-grow:1">
        <span style="font-size:16px;font-weight:700;line-height:1.3">Get matched with 3 students who share this wish</span>
        <span style="display:flex;gap:6px"><span style="font-size:12px;font-weight:700;background:#F0F4F7;color:#4A5B6B;border-radius:999px;padding:3px 9px">5 min</span><span style="font-size:12px;font-weight:700;background:#E3F4EA;color:#1E6B3F;border-radius:999px;padding:3px 9px">Free</span></span>

    </button>
    <button aria-pressed="true" style="display:flex;align-items:center;gap:12px;text-align:left;background:#F2F9FC;border:2px solid #00629B;border-radius:14px;padding:13.5px 15.5px;font-family:'Figtree',sans-serif;color:#002855">
      <span style="display:flex;flex-direction:column;gap:8px;flex-grow:1">
        <span style="font-size:16px;font-weight:800;line-height:1.3">Message one alum who works in healthcare</span>
        <span style="display:flex;gap:6px"><span style="font-size:12px;font-weight:700;background:#FFFFFF;color:#4A5B6B;border-radius:999px;padding:3px 9px">20 min</span><span style="font-size:12px;font-weight:700;background:#E3F4EA;color:#1E6B3F;border-radius:999px;padding:3px 9px">Free</span></span>
      </span>
      <span style="flex-shrink:0;width:24px;height:24px;border-radius:50%;background:#00629B;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" style="width:14px;height:14px" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="4,13 9,18 20,6"></polyline></svg></span>
    </button>
    <button aria-pressed="false" style="display:flex;align-items:center;gap:12px;text-align:left;background:#FFFFFF;border:1.5px solid #D5DEE6;border-radius:14px;padding:14px 16px;font-family:'Figtree',sans-serif;color:#002855">
      <span style="display:flex;flex-direction:column;gap:8px;flex-grow:1">
        <span style="font-size:16px;font-weight:700;line-height:1.3">Book a chat with a senior in the field</span>
        <span style="display:flex;gap:6px"><span style="font-size:12px;font-weight:700;background:#F0F4F7;color:#4A5B6B;border-radius:999px;padding:3px 9px">30 min</span><span style="font-size:12px;font-weight:700;background:#FFF1D6;color:#7A4B00;border-radius:999px;padding:3px 9px">Paid</span></span>
      </span>
      <span style="flex-shrink:0;width:24px;height:24px;border-radius:50%;border:2px solid #B7C4D0;box-sizing:border-box"></span>

  <div style="display:flex;align-items:center;gap:8px">
    <button style="min-height:44px;background:none;border:none;padding:0;font-family:'Figtree',sans-serif;font-size:15px;font-weight:700;color:#00629B;flex-grow:1;text-align:left">Show me different options</button>
    <span style="font-size:13px;font-weight:600;color:#4A5B6B">Helpful?</span>
    <button style="height:44px;padding:0 14px;background:#F0F4F7;border:none;border-radius:999px;font-family:'Figtree',sans-serif;font-size:14px;font-weight:700;color:#002855">Yes</button>
    <button style="height:44px;padding:0 14px;background:#F0F4F7;border:none;border-radius:999px;font-family:'Figtree',sans-serif;font-size:14px;font-weight:700;color:#002855">No</button>
  </div>

  <a href="#" style="margin-top:auto;display:flex;align-items:center;justify-content:center;height:54px;background:#002855;color:#FFFFFF;border-radius:27px;font-weight:700;font-size:16px;text-decoration:none">Lock in move 1</a>
</div>
